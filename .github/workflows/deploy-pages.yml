name: Deploy to GitHub Pages

# 阶段3: 自动构建 Vite 产物(dist/)并部署到 GitHub Pages。
# 取代"直接把源码丢给 Pages"的错误方式 —— 线上只跑构建产物, 不再依赖 /src/main.js。

on:
  push:
    branches: [main]
  workflow_dispatch:        # 允许在 Actions 页面手动触发

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署, 不互相取消
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist          # dist/ 含 index.html + assets/ + news/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
