<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 405" role="img" aria-label="智能问答系统训练 pipeline">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1228"/>
      <stop offset="100%" stop-color="#1a1030"/>
    </linearGradient>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="none" stroke="#ec4899" stroke-width="1.2"/>
    </marker>
  </defs>
  <rect width="720" height="405" fill="url(#bg3)"/>
  <text x="36" y="40" fill="#e8eaf6" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700">智能问答 · 轻量级中文对话训练流程</text>
  <text x="36" y="62" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="12">参考 minimind · 数据清洗 → Tokenizer → 训练 → 推理 → FastAPI</text>

  <g font-family="Segoe UI, sans-serif">
    <rect x="40" y="120" width="120" height="100" rx="16" fill="rgba(139,92,246,0.14)" stroke="rgba(139,92,246,0.4)"/>
    <text x="100" y="162" text-anchor="middle" fill="#c4b5fd" font-size="14" font-weight="700">数据清洗</text>
    <text x="100" y="186" text-anchor="middle" fill="#94a3b8" font-size="11">中文语料过滤</text>

    <rect x="190" y="120" width="120" height="100" rx="16" fill="rgba(139,92,246,0.14)" stroke="rgba(139,92,246,0.4)"/>
    <text x="250" y="162" text-anchor="middle" fill="#c4b5fd" font-size="14" font-weight="700">Tokenizer</text>
    <text x="250" y="186" text-anchor="middle" fill="#94a3b8" font-size="11">词表 / 编码</text>

    <rect x="340" y="120" width="130" height="100" rx="16" fill="rgba(236,72,153,0.14)" stroke="rgba(236,72,153,0.45)"/>
    <text x="405" y="162" text-anchor="middle" fill="#f9a8d4" font-size="14" font-weight="700">Transformer</text>
    <text x="405" y="186" text-anchor="middle" fill="#94a3b8" font-size="11">轻量预训练</text>

    <rect x="500" y="120" width="100" height="100" rx="16" fill="rgba(78,205,196,0.14)" stroke="rgba(78,205,196,0.45)"/>
    <text x="550" y="162" text-anchor="middle" fill="#4ecdc4" font-size="14" font-weight="700">推理</text>
    <text x="550" y="186" text-anchor="middle" fill="#94a3b8" font-size="11">多轮对话</text>

    <rect x="620" y="120" width="70" height="100" rx="16" fill="rgba(251,146,60,0.14)" stroke="rgba(251,146,60,0.45)"/>
    <text x="655" y="162" text-anchor="middle" fill="#fdba74" font-size="13" font-weight="700">API</text>
    <text x="655" y="186" text-anchor="middle" fill="#94a3b8" font-size="11">FastAPI</text>
  </g>
  <g stroke="#ec4899" stroke-width="1.2" fill="none" marker-end="url(#arr2)">
    <line x1="160" y1="170" x2="184" y2="170"/>
    <line x1="310" y1="170" x2="334" y2="170"/>
    <line x1="470" y1="170" x2="494" y2="170"/>
    <line x1="600" y1="170" x2="614" y2="170"/>
  </g>

  <rect x="40" y="260" width="650" height="70" rx="14" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)"/>
  <text x="60" y="290" fill="#e8eaf6" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">定位</text>
  <text x="60" y="312" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="12">重在跑通完整训练 pipeline，而非只调用现成大模型接口；效果受参数量与算力限制。</text>
</svg>
