<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 405" role="img" aria-label="Flappy Bird AI 端到端 pipeline">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1228"/>
      <stop offset="100%" stop-color="#151030"/>
    </linearGradient>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="none" stroke="#4ecdc4" stroke-width="1.2"/>
    </marker>
  </defs>
  <rect width="720" height="405" fill="url(#bg2)"/>
  <text x="36" y="40" fill="#e8eaf6" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700">端到端 Pipeline：训练 → 导出 → 浏览器推理</text>
  <text x="36" y="62" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="12">PyTorch checkpoint · ONNX · onnxruntime-web / Flask 双通道</text>

  <!-- row 1 -->
  <g font-family="Segoe UI, sans-serif">
    <rect x="48" y="100" width="140" height="72" rx="14" fill="rgba(124,110,245,0.14)" stroke="rgba(124,110,245,0.45)"/>
    <text x="118" y="130" text-anchor="middle" fill="#c4b5fd" font-size="13" font-weight="700">Gym 环境</text>
    <text x="118" y="150" text-anchor="middle" fill="#94a3b8" font-size="11">12 维 state</text>

    <rect x="220" y="100" width="140" height="72" rx="14" fill="rgba(124,110,245,0.14)" stroke="rgba(124,110,245,0.45)"/>
    <text x="290" y="130" text-anchor="middle" fill="#c4b5fd" font-size="13" font-weight="700">Dueling DQN</text>
    <text x="290" y="150" text-anchor="middle" fill="#94a3b8" font-size="11">Value + Advantage</text>

    <rect x="392" y="100" width="140" height="72" rx="14" fill="rgba(78,205,196,0.14)" stroke="rgba(78,205,196,0.45)"/>
    <text x="462" y="130" text-anchor="middle" fill="#4ecdc4" font-size="13" font-weight="700">PER 回放</text>
    <text x="462" y="150" text-anchor="middle" fill="#94a3b8" font-size="11">α / β 退火</text>

    <rect x="564" y="100" width="120" height="72" rx="14" fill="rgba(52,211,153,0.14)" stroke="rgba(52,211,153,0.45)"/>
    <text x="624" y="130" text-anchor="middle" fill="#34d399" font-size="13" font-weight="700">Checkpoint</text>
    <text x="624" y="150" text-anchor="middle" fill="#94a3b8" font-size="11">best / final .pth</text>
  </g>
  <g stroke="#4ecdc4" stroke-width="1.2" fill="none" marker-end="url(#arr)">
    <line x1="188" y1="136" x2="214" y2="136"/>
    <line x1="360" y1="136" x2="386" y2="136"/>
    <line x1="532" y1="136" x2="558" y2="136"/>
  </g>

  <!-- row 2 -->
  <g font-family="Segoe UI, sans-serif">
    <rect x="120" y="230" width="180" height="80" rx="14" fill="rgba(251,146,60,0.12)" stroke="rgba(251,146,60,0.45)"/>
    <text x="210" y="262" text-anchor="middle" fill="#fdba74" font-size="13" font-weight="700">Flask API</text>
    <text x="210" y="284" text-anchor="middle" fill="#94a3b8" font-size="11">POST /api/ai/action</text>

    <rect x="420" y="230" width="200" height="80" rx="14" fill="rgba(78,205,196,0.14)" stroke="rgba(78,205,196,0.5)"/>
    <text x="520" y="262" text-anchor="middle" fill="#4ecdc4" font-size="13" font-weight="700">浏览器 ONNX</text>
    <text x="520" y="284" text-anchor="middle" fill="#94a3b8" font-size="11">onnxruntime-web · 本地推理</text>
  </g>
  <g stroke="#4ecdc4" stroke-width="1.2" fill="none" marker-end="url(#arr)">
    <path d="M624,172 L624,200 L210,200 L210,224"/>
    <path d="M624,172 L624,200 L520,200 L520,224"/>
  </g>

  <text x="36" y="360" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="12">本站游戏区按 A 召唤：优先浏览器 ONNX，本地开发可回退 Flask</text>
</svg>
