<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 405" role="img" aria-label="Flappy Bird AI 训练分数曲线示意">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1228"/>
      <stop offset="100%" stop-color="#151030"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ecdc4" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#4ecdc4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c6ef5"/>
      <stop offset="55%" stop-color="#4ecdc4"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect width="720" height="405" fill="url(#bg)"/>
  <text x="36" y="40" fill="#e8eaf6" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700">Flappy Bird · Dueling DQN 训练曲线（示意）</text>
  <text x="36" y="62" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="12">episode ↑ score · PER + Reward Shaping · 续训 8k episodes</text>

  <!-- grid -->
  <g stroke="rgba(148,163,184,0.12)" stroke-width="1">
    <line x1="56" y1="100" x2="680" y2="100"/>
    <line x1="56" y1="170" x2="680" y2="170"/>
    <line x1="56" y1="240" x2="680" y2="240"/>
    <line x1="56" y1="310" x2="680" y2="310"/>
    <line x1="56" y1="340" x2="680" y2="340"/>
  </g>
  <g fill="#64748b" font-family="Consolas, monospace" font-size="11">
    <text x="20" y="104">200</text>
    <text x="20" y="174">150</text>
    <text x="20" y="244">100</text>
    <text x="20" y="314">50</text>
    <text x="28" y="344">0</text>
    <text x="56" y="365">0</text>
    <text x="220" y="365">2k</text>
    <text x="390" y="365">4k</text>
    <text x="560" y="365">6k</text>
    <text x="650" y="365">8k</text>
  </g>

  <!-- noisy rising score band -->
  <path d="M56,320 C90,310 110,300 140,295 S190,270 220,255 S270,230 300,210 S360,185 400,165 S470,140 520,125 S600,105 680,95 L680,340 L56,340 Z" fill="url(#area)"/>
  <path d="M56,320 C90,310 110,300 140,295 S190,270 220,255 S270,230 300,210 S360,185 400,165 S470,140 520,125 S600,105 680,95" fill="none" stroke="url(#line)" stroke-width="3" stroke-linecap="round"/>
  <!-- noise strokes -->
  <path d="M80,315 L100,308 L130,300 L160,288 L200,270 L240,250 L280,235 L320,215 L360,195 L400,175 L450,155 L500,140 L560,120 L620,105 L680,98" fill="none" stroke="rgba(167,139,250,0.35)" stroke-width="1.2"/>

  <!-- markers -->
  <circle cx="400" cy="165" r="5" fill="#4ecdc4"/>
  <text x="410" y="158" fill="#4ecdc4" font-family="Segoe UI, sans-serif" font-size="12">稳定通关区</text>
  <rect x="600" y="70" width="90" height="28" rx="14" fill="rgba(52,211,153,0.15)" stroke="rgba(52,211,153,0.5)"/>
  <text x="618" y="89" fill="#34d399" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">ONNX 就绪</text>
</svg>
